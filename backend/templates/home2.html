{% extends 'base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/leaflet_routing.css' %}">
 
<style>
    #map {
        position: relative;
        height: 100vh;
        margin: 0;
        padding: 0;
        z-index: 0;
    }
</style>

<!-- Sidebar Nav -->
<nav class="w3-sidebar w3-blue-grey w3-collapse w3-top w3-large w3-padding" style="z-index:3;width:70px;font-weight:bold;" id="mySidebar"><br>
    <a href="/" class="button w3-xlarge w3-round-large" style="display:block; text-align:center; margin-bottom: 12px;" title="Back to Map Search"><img src="{% static 'images/map.png' %}" style="height: 20px;"></a>
    <button class="button w3-xlarge w3-round-large" onclick="w3_open1()" title="Toggle Stations Panel"><img src="{% static 'images/route.png' %}" style="height: 20px;"></button>
</nav>

<header class="w3-container w3-top w3-hide-large w3-blue-grey w3-xlarge w3-padding" style="z-index: 2;">
    <a href="/" class="w3-button w3-margin-right">← Back</a>
    <span>Route Stations</span>
</header>

<!-- Stations Sidebar Panel -->
<div class="w3-sidebar w3-bar-block w3-border-right" style="position: fixed; top: 0; left: 70px; width: 340px; z-index: 4; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.1);" id="x">
    <div class="w3-padding" style="border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: bold; font-size: 15px;">Route Stations</span>
        <button onclick="w3_close1()" class="w3-button w3-text-red w3-round">&times;</button>
    </div>
    {% include 'Elements/routeStations.html' %}
</div>

<!-- Page Content -->
<div class="w3-main" style="margin-left:70px;">
    <div id="map"></div>  
</div>

<script src="{% static 'js/1_outputMenu.js' %}"></script>
<script src="{% static 'js/2_loadmap.js' %}"></script>
<script src="{% static 'js/3_myLocation.js' %}"></script>

<script>
    function w3_open1() {
        document.getElementById("x").style.display = "block";
    }
        
    function w3_close1() {
        document.getElementById("x").style.display = "none";
    }
</script>
{% endblock %}
