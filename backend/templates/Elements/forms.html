<div id="formhandling">
    <form id="myForm" class="w3-padding" style="max-width: 350px;" method="get" onsubmit="event.preventDefault(); submitForm();">
        <div style="margin-bottom: 12px;">
            <label style="font-size: 13px; font-weight: bold; color: #333;">Origin Location:</label>
            <input id="loc1" class="w3-input w3-border w3-round" name="userlocation" type="text" placeholder="e.g. Kalanki" required value="{{ my_location_name|default:'' }}">
        </div>
        <div style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: bold; color: #333;">Destination:</label>
            <input id="loc2" class="w3-input w3-border w3-round" name="destlocation" type="text" placeholder="e.g. Koteshwor" required value="{{ dest_location_name|default:'' }}">
        </div>
        <div style="margin-bottom: 8px;">
            <button type="button" class="w3-button w3-blue-grey w3-round w3-block" onclick="submitForm()" style="font-weight: 600;">
                Find Route & Nearest Stops
            </button>
        </div>
    </form>    
    <ul id="suggestions-list" class="w3-bar" style="display: none; max-height: 200px; overflow-y: auto;"></ul>
</div>

<script>
    const searchInput = document.getElementById('loc2');
    const suggestionsList = document.getElementById('suggestions-list');

    // Make request to GraphHopper Geocoding API for Kathmandu locations
    async function getLocationSuggestions(query) {
        const apiKey = '8e95a1e4-6d07-488c-8f23-d95874da0c18';
        const endpoint = 'https://graphhopper.com/api/1/geocode';
        try {
            const response = await fetch(`${endpoint}?q=${encodeURIComponent(query)}&key=${apiKey}`);
            if (!response.ok) return [];
            const data = await response.json();
            const nepalSuggestions = data.hits.filter(hit => !hit.countrycode || hit.countrycode === 'NP');
            return nepalSuggestions.map(hit => hit.name);
        } catch (e) {
            return [];
        }
    }

    async function updateSuggestions() {
        if (!searchInput) return;
        const query = searchInput.value.trim();
        if (query.length < 2) {
            suggestionsList.style.display = 'none';
            return;
        }

        const suggestions = await getLocationSuggestions(query);
        if (suggestions.length > 0) {
            suggestionsList.innerHTML = suggestions.map(s => `<li class="w3-padding-small w3-hover-light-grey" style="cursor: pointer;">${s}</li>`).join('');
            suggestionsList.style.display = 'block';
        } else {
            suggestionsList.style.display = 'none';
        }
    }

    if (searchInput) {
        searchInput.addEventListener('input', updateSuggestions);
    }

    if (suggestionsList) {
        suggestionsList.addEventListener('click', (event) => {
            if (event.target.tagName === 'LI') {
                searchInput.value = event.target.textContent;
                suggestionsList.style.display = 'none';
            }
        });
    }

    function submitForm() {
        const loc1Value = document.getElementById("loc1").value.trim();
        const loc2Value = document.getElementById("loc2").value.trim();

        if (!loc1Value || !loc2Value) {
            alert("Please enter both an origin location and a destination location.");
            return;
        }

        // Relative URL navigation (no hardcoded localhost:8000)
        window.location.href = "/api/post-to-get-nearest-station/" + encodeURIComponent(loc1Value) + "/" + encodeURIComponent(loc2Value) + "/";
    }
</script>
